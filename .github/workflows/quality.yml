name: Quality Assurance

on:
  pull_request:
    branches: [ main, upgrade/phase-18-20-experience-polish ]
  push:
    branches: [ main ]

permissions:
  contents: read

concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: ESLint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: ESLint
        run: npm run lint

  build:
    name: TypeScript and Vite production build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Production build
        run: npm run build

  dependency-audit:
    name: Dependency vulnerability report
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Report dependency vulnerabilities
        run: npm audit --json > npm-audit.json
        continue-on-error: true

      - name: Upload audit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: npm-audit-report
          path: npm-audit.json
          if-no-files-found: ignore

  asset-audit:
    name: Static asset inventory and budget report
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Generate asset report
        run: node scripts/asset-audit.mjs

      - name: Upload asset report
        uses: actions/upload-artifact@v4
        with:
          name: static-asset-audit
          path: asset-audit.md
          if-no-files-found: error

  site-integrity:
    name: SEO and deployment integrity
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate canonical metadata, sitemap, robots and social image
        run: npm run check:site

  experience-integrity:
    name: Audio experience and accessibility regression
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Validate opt-in audio and accessible controls
        run: npm run check:experience

  public-asset-integrity:
    name: Public asset deduplication integrity
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Validate canonical public reference assets
        run: npm run check:assets

  visual-experience-integrity:
    name: Visual motion and accessibility regression
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Validate motion and responsive safeguards
        run: npm run check:visual

  immersive-archive-integrity:
    name: Immersive archive interaction regression
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Validate gallery gestures and selected map state
        run: npm run check:archive

  editorial-depth-integrity:
    name: Editorial chapter transition regression
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Validate chapter transitions and motion safeguards
        run: npm run check:editorial
