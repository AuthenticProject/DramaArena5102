name: Dependency Lockfile Refresh

on:
  push:
    branches:
      - maintenance/phase-17-dependency-cleanup

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: maintenance/phase-17-dependency-cleanup
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Remove unused Jimp and install lint tooling as project dev dependencies
        run: |
          npm uninstall jimp
          npm install --save-dev eslint@8.57.1 @typescript-eslint/parser@7.18.0 @typescript-eslint/eslint-plugin@7.18.0 eslint-plugin-react-hooks@5.2.0
      - name: Verify clean install, lint, and build
        run: |
          npm ci
          npm run lint
          npm run build
      - name: Commit refreshed manifests and lockfile
        run: |
          if git diff --quiet -- package.json package-lock.json; then
            echo "No dependency manifest changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          git commit -m "chore: remove unused Jimp and lock ESLint tooling"
          git push
