            const target = e.target;
            const isClickable = target.closest('button, a, input, select, .bento-card, [role="button"]');
            setIsHovered(!!isClickable);
          };
          window.addEventListener('mousemove', onMouseMove);
          return () => window.removeEventListener('mousemove', onMouseMove);
        }, []);

        if (typeof window !== 'undefined' && window.innerWidth < 768) return null;

        return (
          <div
            className="fixed pointer-events-none z-50 transition-transform duration-75 ease-out"
            style={{
              left: `${pos.x}px`,
              top: `${pos.y}px`,
              transform: `scale(${isHovered ? 1.25 : 1})`,
              filter: isHovered ? 'drop-shadow(0 0 12px rgba(214,145,3,0.8))' : 'drop-shadow(0 2px 6px rgba(6,43,74,0.4))'

      // Bento Card Container with 3D Mouse Parallax Tilt Motion
      const BentoCard = ({ children, className = "" }) => {
        const cardRef = useRef(null);

        const handleMouseMove = (e) => {
          if (!cardRef.current) return;
          const rect = cardRef.current.getBoundingClientRect();
          const x = e.clientX - rect.left - rect.width / 2;
          const y = e.clientY - rect.top - rect.height / 2;
          const rotateX = (-y / rect.height) * 12;
          const rotateY = (x / rect.width) * 12;
          cardRef.current.style.transform = `perspective(1000px) rotateX(${rotateX}deg) rotateY(${rotateY}deg) translateY(-4px)`;
        };

        const handleMouseLeave = () => {
          if (!cardRef.current) return;
          cardRef.current.style.transform = 'perspective(1000px) rotateX(0deg) rotateY(0deg) translateY(0px)';
        };

        return (
          <div
            ref={cardRef}
            onMouseMove={handleMouseMove}
            onMouseLeave={handleMouseLeave}
            className={`bento-card ${className}`}
          >
            {children}
          </div>
        );

      // 3D GLB Indonesia Map Component
      const IndonesiaMap3D = () => {
        const mountRef = useRef(null);
        const [loading, setLoading] = useState(true);
        const [loadingProgress, setLoadingProgress] = useState(0);
        const [autoRotate, setAutoRotate] = useState(true);
        const [activeCampus, setActiveCampus] = useState(gontorCampuses[0]);
        const [searchQuery, setSearchQuery] = useState('');
        const controlsRef = useRef(null);
        const cameraRef = useRef(null);
        const pinMeshesRef = useRef([]);

        const filteredCampuses = gontorCampuses.filter(
          (c) =>
            c.name.toLowerCase().includes(searchQuery.toLowerCase()) ||
            c.code.toLowerCase().includes(searchQuery.toLowerCase()) ||
            c.location.toLowerCase().includes(searchQuery.toLowerCase())
        );

        const focusOnCampus = (campus) => {
          setActiveCampus(campus);
          if (controlsRef.current && cameraRef.current) {
            const controls = controlsRef.current;
            controls.target.set(campus.x, 0, campus.z);
            cameraRef.current.position.set(campus.x, 18, campus.z + 24);
            controls.update();
          }
        };

        useEffect(() => {
          let animationFrameId;
          let renderer, scene, camera, controls, raycaster, mouse;

          const loadThreeScript = async () => {
            if (!window.THREE) {
              await new Promise((resolve) => {
                const script = document.createElement('script');
                script.src = 'https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js';
                script.onload = resolve;
                document.head.appendChild(script);
              });
            }
            if (!window.THREE?.GLTFLoader) {
              await new Promise((resolve) => {
                const script = document.createElement('script');
                script.src = 'https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js';
                script.onload = resolve;
                document.head.appendChild(script);
              });
            }
            if (!window.THREE?.OrbitControls) {
              await new Promise((resolve) => {
                const script = document.createElement('script');
                script.src = 'https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js';
                script.onload = resolve;
                document.head.appendChild(script);
              });
            }

            initThree();
          };

          const createBadgeTexture = (THREE, text, isPusat = false) => {
            const canvas = document.createElement('canvas');
            canvas.width = 256;
            canvas.height = 256;
            const ctx = canvas.getContext('2d');

            ctx.shadowColor = 'rgba(214, 145, 3, 0.8)';
            ctx.shadowBlur = 15;

            ctx.beginPath();
            ctx.arc(128, 128, 105, 0, Math.PI * 2);
            ctx.fillStyle = '#062B4A';
            ctx.fill();

            ctx.lineWidth = 10;
            ctx.strokeStyle = isPusat ? '#F5D98A' : '#D69103';
            ctx.stroke();

            ctx.beginPath();
            ctx.arc(128, 128, 92, 0, Math.PI * 2);
            ctx.lineWidth = 3;
            ctx.setLineDash([8, 6]);
            ctx.strokeStyle = '#F5D98A';
            ctx.stroke();
            ctx.setLineDash([]);

            ctx.shadowBlur = 0;

            if (isPusat) {
              ctx.font = 'bold 36px Georgia, serif';
              ctx.fillStyle = '#F5D98A';
              ctx.textAlign = 'center';
              ctx.fillText('👑 PUSAT', 128, 98);

              ctx.font = 'bold 38px Georgia, serif';
              ctx.fillStyle = '#FFFFFF';
              ctx.fillText('PMDG', 128, 152);
            } else {
              ctx.font = 'bold 46px Georgia, serif';
              ctx.fillStyle = '#F5D98A';
              ctx.textAlign = 'center';
              ctx.textBaseline = 'middle';
              ctx.fillText(text, 128, 128);
            }

            const texture = new THREE.CanvasTexture(canvas);
            texture.needsUpdate = true;
            return texture;
          };

          const initThree = () => {
            if (!mountRef.current) return;
            const THREE = window.THREE;
            const container = mountRef.current;
            const width = container.clientWidth;
            const height = container.clientHeight;

            scene = new THREE.Scene();
            raycaster = new THREE.Raycaster();
            mouse = new THREE.Vector2();

            camera = new THREE.PerspectiveCamera(45, width / height, 0.1, 1000);
            camera.position.set(0, 36, 62);
            cameraRef.current = camera;

            renderer = new THREE.WebGLRenderer({ alpha: true, antialias: true });
            renderer.setSize(width, height);
            renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
            renderer.shadowMap.enabled = true;
            renderer.shadowMap.type = THREE.PCFSoftShadowMap;

            while (container.firstChild) {
              container.removeChild(container.firstChild);
            }
            container.appendChild(renderer.domElement);

            controls = new THREE.OrbitControls(camera, renderer.domElement);
            controls.enableDamping = true;
            controls.dampingFactor = 0.05;
            controls.maxPolarAngle = Math.PI / 2.15;
            controls.minDistance = 12;
            controls.maxDistance = 140;
            controls.autoRotate = autoRotate;
            controls.autoRotateSpeed = 0.35;
            controlsRef.current = controls;

            const ambientLight = new THREE.AmbientLight(0xF4F1EB, 0.95);
            scene.add(ambientLight);

            const mainLight = new THREE.DirectionalLight(0xF5D98A, 2.5);
            mainLight.position.set(30, 50, 40);
            mainLight.castShadow = true;
            scene.add(mainLight);

            const fillLight = new THREE.DirectionalLight(0x062B4A, 1.3);
            fillLight.position.set(-30, 20, -30);
            scene.add(fillLight);

            const pointLight = new THREE.PointLight(0xD69103, 2.0, 100);
            pointLight.position.set(0, 25, 10);
            scene.add(pointLight);

            const goldColors = [0xD69103, 0xE8A820, 0xB8860B, 0xF5D98A, 0xC58000];

            if (THREE.GLTFLoader) {
              const loader = new THREE.GLTFLoader();
              loader.load(
                '/peta_provinsi_indonesia.glb',
                (gltf) => {
                  const model = gltf.scene;

                  const initialBox = new THREE.Box3().setFromObject(model);
                  const initialSize = initialBox.getSize(new THREE.Vector3());

                  if (initialSize.y > initialSize.z * 1.5) {
                    model.rotation.x = -Math.PI / 2;
                  }

                  const modelWrapper = new THREE.Group();

                  const box = new THREE.Box3().setFromObject(model);
                  const center = box.getCenter(new THREE.Vector3());
                  const size = box.getSize(new THREE.Vector3());

                  model.position.set(-center.x, -center.y, -center.z);
                  modelWrapper.add(model);

                  const maxDim = Math.max(size.x, size.y, size.z);
                  const scale = 50 / maxDim;
                  modelWrapper.scale.set(scale, scale, scale);

                  let meshIdx = 0;
                  model.traverse((child) => {
                    if (child.isMesh) {
                      child.castShadow = true;
                      child.receiveShadow = true;
                      const colorHex = goldColors[meshIdx % goldColors.length];
                      meshIdx++;

                      child.material = new THREE.MeshStandardMaterial({
                        color: colorHex,
                        metalness: 0.75,
                        roughness: 0.3,
                        emissive: 0x1a1100,
                        shadowSide: THREE.DoubleSide
                      });
                    }
                  });

                  scene.add(modelWrapper);
                  modelWrapper.updateMatrixWorld(true);

                  const findLandSurfaceY = (targetX, targetZ) => {
                    const downRay = new THREE.Raycaster();
                    const rayDir = new THREE.Vector3(0, -1, 0);

                    downRay.set(new THREE.Vector3(targetX, 100, targetZ), rayDir);
                    let hits = downRay.intersectObject(modelWrapper, true);
                    if (hits.length > 0) {
                      return { y: hits[0].point.y, posX: targetX, posZ: targetZ };
                    }

                    const radii = [0.2, 0.5, 0.8, 1.2, 1.8, 2.5];
                    const angles = [0, Math.PI / 4, Math.PI / 2, 3 * Math.PI / 4, Math.PI, 5 * Math.PI / 4, 3 * Math.PI / 2, 7 * Math.PI / 4];
                    for (const r of radii) {
                      for (const a of angles) {
                        const testX = targetX + r * Math.cos(a);
                        const testZ = targetZ + r * Math.sin(a);
                        downRay.set(new THREE.Vector3(testX, 100, testZ), rayDir);
                        hits = downRay.intersectObject(modelWrapper, true);
                        if (hits.length > 0) {
                          return { y: hits[0].point.y, posX: testX, posZ: testZ };
                        }
                      }
                    }

                    const mapBox = new THREE.Box3().setFromObject(modelWrapper);
                    return { y: mapBox.max.y, posX: targetX, posZ: targetZ };
                  };

                  const pusatCampus = gontorCampuses[0];
                  const pusatLand = findLandSurfaceY(pusatCampus.x, pusatCampus.z);
                  const pusatPos = new THREE.Vector3(pusatLand.posX, pusatLand.y + 0.3, pusatLand.posZ);

                  const createdPinMeshes = [];

                  gontorCampuses.forEach((campus) => {
                    const land = findLandSurfaceY(campus.x, campus.z);
                    const branchPos = new THREE.Vector3(land.posX, land.y + 0.3, land.posZ);

                    if (!campus.isPusat) {
                      const midX = (pusatPos.x + branchPos.x) / 2;
                      const midZ = (pusatPos.z + branchPos.z) / 2;
                      const dist = pusatPos.distanceTo(branchPos);
                      const midY = Math.max(pusatPos.y, branchPos.y) + Math.min(dist * 0.3, 10);

                      const curve = new THREE.QuadraticBezierCurve3(
                        pusatPos,
                        new THREE.Vector3(midX, midY, midZ),
                        branchPos
                      );

                      const points = curve.getPoints(40);
                      const curveGeo = new THREE.BufferGeometry().setFromPoints(points);
                      const curveMat = new THREE.LineBasicMaterial({
                        color: 0xF5D98A,
                        transparent: true,
                        opacity: 0.65,
                        linewidth: 2
                      });
                      const curveLine = new THREE.Line(curveGeo, curveMat);
                      scene.add(curveLine);
                    }

                    const pinGroup = new THREE.Group();
                    pinGroup.position.set(land.posX, land.y, land.posZ);

                    const ringGeo = new THREE.RingGeometry(0.3, 0.7, 32);
                    const ringMat = new THREE.MeshBasicMaterial({
                      color: campus.isPusat ? 0xFFDF73 : 0xD69103,
                      side: THREE.DoubleSide,
                      transparent: true,
                      opacity: 0.95
                    });
                    const ringMesh = new THREE.Mesh(ringGeo, ringMat);
                    ringMesh.rotation.x = Math.PI / 2;
                    ringMesh.position.y = 0.05;
                    pinGroup.add(ringMesh);

                    const stemGeo = new THREE.CylinderGeometry(0.08, 0.08, 1.8, 8);
                    const stemMat = new THREE.MeshBasicMaterial({ color: campus.isPusat ? 0xFFDF73 : 0xD69103 });
                    const stemMesh = new THREE.Mesh(stemGeo, stemMat);
                    stemMesh.position.y = 0.9;
                    pinGroup.add(stemMesh);

                    const badgeTexture = createBadgeTexture(THREE, campus.code, campus.isPusat);
                    const spriteMat = new THREE.SpriteMaterial({ map: badgeTexture, transparent: true });
                    const sprite = new THREE.Sprite(spriteMat);
                    sprite.scale.set(campus.isPusat ? 3.2 : 2.5, campus.isPusat ? 3.2 : 2.5, 1);
                    sprite.position.y = 2.4;
                    sprite.userData = campus;
                    pinGroup.add(sprite);
                    createdPinMeshes.push(sprite);

                    if (campus.isPusat) {
                      const bigRingGeo = new THREE.RingGeometry(0.8, 1.6, 32);
                      const bigRingMat = new THREE.MeshBasicMaterial({ color: 0xF5D98A, side: THREE.DoubleSide, transparent: true, opacity: 0.8 });
                      const bigRingMesh = new THREE.Mesh(bigRingGeo, bigRingMat);
                      bigRingMesh.rotation.x = Math.PI / 2;
                      bigRingMesh.position.y = 0.06;
                      pinGroup.add(bigRingMesh);

                      const glowLight = new THREE.PointLight(0xF5D98A, 2.8, 14);
                      glowLight.position.y = 2.4;
                      pinGroup.add(glowLight);
                    }

                    scene.add(pinGroup);
                  });
                  pinMeshesRef.current = createdPinMeshes;

                  setLoading(false);
                },
                (xhr) => {
                  if (xhr.lengthComputable) {
                    const percent = Math.round((xhr.loaded / xhr.total) * 100);
                    setLoadingProgress(percent);
                  }
                },
                (err) => {
                  console.error(err);
                  setLoading(false);
                }
              );
            }

            const handlePointerMove = (event) => {
              const rect = renderer.domElement.getBoundingClientRect();
              mouse.x = ((event.clientX - rect.left) / rect.width) * 2 - 1;
              mouse.y = -((event.clientY - rect.top) / rect.height) * 2 + 1;

              raycaster.setFromCamera(mouse, camera);
              const intersects = raycaster.intersectObjects(pinMeshesRef.current);
              if (intersects.length > 0) {
                const campusData = intersects[0].object.userData;
                if (campusData) {
                  setActiveCampus(campusData);
                }
              }
            };
            renderer.domElement.addEventListener('mousemove', handlePointerMove);

            const animate = () => {
              animationFrameId = requestAnimationFrame(animate);
              if (controls) controls.update();
              if (renderer && scene && camera) renderer.render(scene, camera);
            };
            animate();

            const handleResize = () => {
              if (!container || !renderer || !camera) return;
              const w = container.clientWidth;
              const h = container.clientHeight;
              camera.aspect = w / h;
              camera.updateProjectionMatrix();
              renderer.setSize(w, h);
            };
            window.addEventListener('resize', handleResize);

            return () => {
              window.addEventListener('resize', handleResize);
              if (renderer?.domElement) {
                renderer.domElement.removeEventListener('mousemove', handlePointerMove);
                renderer.domElement.remove();
              }
              cancelAnimationFrame(animationFrameId);
            };
          };

          initThree();
        }, []);

        const toggleAutoRotate = () => {
          const nextState = !autoRotate;
          setAutoRotate(nextState);
          if (controlsRef.current) controlsRef.current.autoRotate = nextState;
        };

        const resetCameraView = () => {
          if (controlsRef.current && cameraRef.current) {
            controlsRef.current.target.set(0, 0, 0);
            cameraRef.current.position.set(0, 36, 62);
            controlsRef.current.reset();
          }
        };

        return (
          <section id="map" className="relative py-20 px-6 border-t border-[#D69103]/20 bg-[#062B4A] reveal-on-scroll">
            <div className="max-w-6xl mx-auto">
              <div className="text-center mb-10">
                <div className="inline-flex items-center gap-2 px-4 py-1.5 rounded-full border border-[#D69103]/40 bg-[#D69103]/10 text-[#F5D98A] text-xs md:text-sm mb-3">
                  <Sparkles className="w-4 h-4 text-[#D69103] animate-pulse" />
                  3D NUSANTARA MAP · PROPOSAL DRAMA ARENA HAL 8-9
                </div>
                <h2 className="text-3xl md:text-5xl font-bold tracking-tight font-mileast italic text-[#F5D98A]">
                  Peta 3D Kampus Gontor
                </h2>
                <p className="font-baskerville text-gray-300 text-sm mt-3 max-w-xl mx-auto">
                  Visualisasi 3D Interaktif Kepulauan Indonesia & Pancaran Cabang PMDG dari Kampus Pusat Ponorogo.
                </p>

                <div className="mt-6 max-w-md mx-auto relative">
                  <Search className="w-4 h-4 absolute left-4 top-1/2 -translate-y-1/2 text-[#D69103]" />
                  <input
                    type="text"
                    placeholder="Cari Kampus atau Provinsi (cth: Aceh, Riau, Kediri, Sultra)..."
                    value={searchQuery}
                    onChange={(e) => setSearchQuery(e.target.value)}
                    className="w-full pl-11 pr-4 py-2.5 rounded-full bg-[#041B30] border border-[#D69103]/50 text-sm text-[#F4F1EB] placeholder-gray-400 focus:outline-none focus:border-[#F5D98A] transition-all shadow-inner"
                  />
                </div>
              </div>

              <div className="p-4 rounded-3xl bg-[#041B30] border-2 border-[#D69103]/50 relative overflow-hidden group shadow-[0_20px_60px_rgba(0,0,0,0.5)]">
                <div className="flex flex-wrap items-center justify-between px-4 py-3 border-b border-[#D69103]/30">
                  <div className="flex items-center gap-2">
                    <div className="w-3 h-3 rounded-full bg-[#D69103] animate-pulse" />
                    <span className="text-sm font-semibold text-[#F4F1EB]">Interactive 3D GLB Model</span>
                  </div>
                  <div className="flex items-center gap-2 mt-2 sm:mt-0">
                    <button
                      onClick={toggleAutoRotate}
                      className="bg-[#D69103] hover:bg-[#E8A820] text-[#062B4A] font-semibold px-4 py-1.5 rounded-full text-xs transition-all shadow-[0_0_15px_rgba(214,145,3,0.3)] cursor-pointer"
                    >
                      {autoRotate ? '⏸ Lambatkan & Putar' : '▶ Putar Lambat'}
                    </button>
                    <button
                      onClick={resetCameraView}
                      className="border border-[#D69103]/50 hover:bg-[#D69103]/20 text-[#F4F1EB] font-medium px-4 py-1.5 rounded-full text-xs transition-all cursor-pointer"
                    >
                      ↺ Reset View
                    </button>
                  </div>
                </div>

                    <div className="w-8 h-8 rounded-full bg-[#062B4A] text-[#D69103] font-bold text-xs flex items-center justify-center mb-4 group-hover:scale-110 transition-transform">
                      0{idx + 1}
                    </div>
                    <h4 className="font-bold text-base text-[#062B4A] mb-2">{sf.title}</h4>
                    <p className="text-xs text-gray-700 leading-relaxed font-baskerville">{sf.desc}</p>
                  </BentoCard>
                ))}
              </div>
            </section>

            {/* BENTO SHOWS & EVENTS */}
            <section id="shows" className="max-w-6xl mx-auto px-6 py-20 border-t border-[#062B4A]/10 reveal-on-scroll">
              <div className="text-center mb-16">
                <div className="text-xs text-[#D69103] font-bold uppercase tracking-widest mb-2">ACARA UTAMA</div>
                <h2 className="text-3xl md:text-5xl font-bold font-mileast italic">
                  Ragam <span className="gold-text not-italic">Pertunjukan</span>
                </h2>
              </div>

              <div className="grid grid-cols-1 sm:grid-cols-2 gap-6">
                {showsData.map((show) => (
                  <BentoCard key={show.id} onClick={() => setActiveShow(show)} className="p-6 rounded-3xl cursor-pointer group">
                    <div className="relative h-48 rounded-2xl overflow-hidden mb-5">
                      <img src={show.img} alt={show.title} className="w-full h-full object-cover filter sepia-[0.2] group-hover:scale-105 transition-transform duration-500" />
                      <div className="absolute inset-0 bg-gradient-to-t from-[#062B4A] via-transparent to-transparent" />
                      <div className="absolute top-3 left-3 text-3xl font-extrabold gold-text opacity-60">{show.number}</div>
                      <div className="absolute bottom-3 left-4">
                        <div className="text-xs text-[#F5D98A] font-bold tracking-wider uppercase">{show.category}</div>
                        <h3 className="text-lg font-bold text-white">{show.title}</h3>
                      </div>
                    </div>
                    <div className="flex flex-wrap gap-2">
                      {show.items.map(item => (
                        <span key={item} className="px-3 py-1 rounded-full bg-[#062B4A]/10 border border-[#D69103]/40 text-xs text-[#062B4A] font-semibold">
                          {item}
                        </span>
                      ))}
                    </div>
                  </BentoCard>
                ))}
              </div>
            </section>

            {/* COMMITTEE & BUDGET */}
            <section id="committee" className="max-w-6xl mx-auto px-6 py-20 border-t border-[#062B4A]/10 reveal-on-scroll">
              <div className="text-center mb-12">
                <div className="text-xs text-[#D69103] font-bold uppercase tracking-widest mb-2">KEPANITIAAN RESMI</div>
                <h2 className="text-3xl md:text-5xl font-bold font-mileast italic">
                  Panitia & <span className="gold-text not-italic">Anggaran</span>
                </h2>
                
                <div className="flex justify-center gap-3 mt-6">
                  <button
                    onClick={() => setCommitteeTab('panitia')}
                    className={`px-6 py-2 rounded-full text-xs font-bold uppercase tracking-wider transition-all cursor-pointer ${
                      committeeTab === 'panitia' ? 'bg-[#062B4A] text-[#D69103] shadow-lg' : 'bg-[#062B4A]/10 text-[#062B4A] border border-[#062B4A]/20'
                    }`}
                  >
                    Susunan Panitia
                  </button>
                  <button
                    onClick={() => setCommitteeTab('anggaran')}
                    className={`px-6 py-2 rounded-full text-xs font-bold uppercase tracking-wider transition-all cursor-pointer ${
                      committeeTab === 'anggaran' ? 'bg-[#062B4A] text-[#D69103] shadow-lg' : 'bg-[#062B4A]/10 text-[#062B4A] border border-[#062B4A]/20'
                    }`}
                  >
                    Rencana Anggaran
                  </button>
                </div>
              </div>

              {committeeTab === 'panitia' ? (
                <div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-5">
                  {committeeData.map((group, idx) => (
                    <BentoCard key={idx} className="p-6 rounded-3xl">
                      <div className="flex items-center gap-2 mb-3 pb-3 border-b border-[#D69103]/30">
                        <div className="w-6 h-6 rounded-full bg-[#062B4A] text-[#D69103] text-xs font-bold flex items-center justify-center">{idx + 1}</div>
                        <h4 className="font-bold text-sm text-[#062B4A] uppercase">{group.role}</h4>
                      </div>
                      <ul className="space-y-1.5 text-xs text-gray-700 font-baskerville">
                        {group.names.map((n, i) => (
                          <li key={i} className="flex items-start gap-1.5"><span className="text-[#D69103]">•</span>{n}</li>
                        ))}
                      </ul>
                    </BentoCard>
                  ))}
                </div>
              ) : (
                <BentoCard className="max-w-3xl mx-auto p-8 rounded-3xl">
                  <div className="flex flex-col sm:flex-row justify-between items-start sm:items-center pb-6 mb-6 border-b border-[#062B4A]/20 gap-4">
                    <div>
                      <h3 className="text-xl font-bold text-[#062B4A]">Anggaran Kepanitiaan</h3>
                      <p className="text-xs text-[#D69103] font-bold mt-1">Drama Arena 5102 · T.A. 1447-1448</p>
                    </div>
                    <div className="p-4 rounded-2xl bg-[#062B4A] text-[#F4F1EB] text-right">
                      <div className="text-xs opacity-70">Total Keseluruhan</div>
                      <div className="text-xl font-bold gold-text">Rp 500.107.000</div>
                    </div>
                  </div>

                  <div className="overflow-x-auto">
                    <table className="w-full text-sm">
                      <thead>
                        <tr className="border-b-2 border-[#D69103] text-xs text-[#062B4A] uppercase font-bold">
                          <th className="py-2 text-left">No</th>
                          <th className="py-2 text-left">Bagian</th>
                          <th className="py-2 text-right">Nominal</th>
                        </tr>
                      </thead>
                      <tbody className="divide-y divide-[#062B4A]/10">
                        {budgetItems.map((b) => (
                          <tr key={b.no} className="hover:bg-[#062B4A]/5 transition-colors">
                            <td className="py-2.5 text-xs text-gray-500">{b.no}.</td>
                            <td className="py-2.5 font-bold text-[#062B4A]">{b.section}</td>
                            <td className="py-2.5 text-right font-bold text-[#062B4A]">{b.amount}</td>
                          </tr>
                        ))}
                      </tbody>
                    </table>
                  </div>
                </BentoCard>
              )}
            </section>

            {/* BENTO FAQ SECTION */}
            <section className="max-w-4xl mx-auto px-6 py-20 border-t border-[#062B4A]/10 reveal-on-scroll">
              <div className="text-center mb-12">
                <div className="text-xs text-[#D69103] font-bold uppercase tracking-widest mb-2">PERTANYAAN UMUM</div>
                <h2 className="text-3xl md:text-4xl font-bold font-mileast italic">
                  Pertanyaan <span className="gold-text not-italic">Populer</span>
                </h2>
              </div>

              <div className="space-y-4">
                {faqsData.map((faq, idx) => (
                  <BentoCard key={idx} className="rounded-2xl overflow-hidden">
                    <button
                      onClick={() => setExpandedFaq(expandedFaq === idx ? null : idx)}
                      className="w-full p-5 text-left font-bold text-[#062B4A] flex items-center justify-between gap-4 cursor-pointer"
                    >
                      <span>{faq.q}</span>
                      <ChevronDown className={`w-4 h-4 text-[#D69103] transition-transform ${expandedFaq === idx ? 'rotate-180' : ''}`} />
                    </button>
                    {expandedFaq === idx && (
                      <div className="p-5 pt-0 text-xs text-gray-700 leading-relaxed font-baskerville border-t border-[#062B4A]/10">
                        {faq.a}
                      </div>
                    )}
                  </BentoCard>
                ))}
              </div>
            </section>

            {/* FLOATING AUDIO PLAYER & BACK TO TOP */}
            <div className="fixed bottom-6 right-6 z-40 flex flex-col items-end gap-3">
              {showBackToTop && (
                <button
                  onClick={() => navTo('root')}
                  className="w-10 h-10 rounded-full bg-[#062B4A] text-[#D69103] border-2 border-[#D69103] flex items-center justify-center shadow-lg hover:scale-110 transition-transform cursor-pointer"
                >
                  <ArrowUp className="w-5 h-5" />
                </button>
              )}

              <div className="p-3.5 rounded-2xl bg-[#062B4A] border-2 border-[#D69103] text-[#F4F1EB] shadow-[0_10px_30px_rgba(0,0,0,0.4)] flex items-center gap-3 max-w-xs">
                <button
                  onClick={toggleAudio}
                  className="w-9 h-9 rounded-full bg-[#D69103] text-[#062B4A] flex items-center justify-center font-bold flex-shrink-0 cursor-pointer shadow-md hover:scale-105 transition-transform"
                >
                  {isPlayingAudio ? <Pause className="w-4 h-4" /> : <Play className="w-4 h-4 ml-0.5" />}
                </button>
                <div className="overflow-hidden">
                  <div className="text-[11px] font-bold text-[#F5D98A] truncate">Teruslah Percaya</div>
                  <div className="text-[9px] text-gray-300 truncate">OST Percaya Asa Short Movie</div>
                </div>
                {isPlayingAudio && (
                  <div className="flex items-end gap-0.5 h-4 px-1">
                    <span className="w-1 bg-[#F5D98A] eq-bar-1" />
                    <span className="w-1 bg-[#D69103] eq-bar-2" />
                    <span className="w-1 bg-[#F5D98A] eq-bar-3" />
                  </div>
                )}
              </div>
            </div>

            {/* FOOTER */}
            <footer className="border-t border-[#062B4A]/20 bg-[#062B4A] text-[#F4F1EB] pt-16 pb-12 px-6">
              <div className="max-w-4xl mx-auto text-center mb-16">
                <div className="text-xs text-[#D69103] font-bold uppercase tracking-widest mb-2">KEMITRAAN RESMI</div>
                <h2 className="text-3xl md:text-5xl font-bold font-mileast italic gold-text mb-4">
                  Dukung Mahakarya Santri Gontor
                </h2>
                <p className="text-gray-300 text-sm max-w-xl mx-auto mb-8 font-baskerville">
                  Jadilah mitra sponsorship dan saksikan pagelaran seni budaya akbar siswa kelas 5 KMI PMDG.
                </p>
                <button onClick={() => setIsModalOpen(true)} className="bg-gradient-to-r from-[#B8860B] via-[#D69103] to-[#E8A820] hover:scale-105 text-[#062B4A] font-bold px-8 py-3.5 rounded-full text-sm transition-all shadow-[0_4px_25px_rgba(214,145,3,0.4)] flex items-center gap-2 mx-auto cursor-pointer">
                  <span>Ajukan Sponsorship</span>
                  <ArrowRight className="w-4 h-4" />
                </button>
              </div>

              <div className="max-w-6xl mx-auto grid grid-cols-1 md:grid-cols-4 gap-8 pt-12 border-t border-white/10 text-xs text-gray-300">
                <div>
                  <div className="font-bold text-base gold-text mb-2">Drama Arena 5102</div>
                  <p className="leading-relaxed font-baskerville">"Naluri dan Nurani" — Sadar akan nilai perjuangan, tumbuhkan semangat kebersamaan.</p>
                </div>
                <div>
                  <div className="font-bold mb-3 uppercase tracking-wider text-[11px] text-[#D69103]">Navigasi</div>
                  <ul className="space-y-2">
                    {[['Profil PMDG','about'],['Tema & Filosofi','theme'],['Timeline Persiapan','timeline'],['Peta 3D Nusantara','map'],['Konsep Panggung','stage'],['Ragam Acara','shows']].map(([l,id]) => (
                      <li key={id}><button onClick={() => navTo(id)} className="hover:text-[#D69103] cursor-pointer">{l}</button></li>
                    ))}
                  </ul>
                </div>
                <div>
                  <div className="font-bold mb-3 uppercase tracking-wider text-[11px] text-[#D69103]">Lokasi</div>
                  <p className="leading-relaxed font-baskerville">Pondok Modern Darussalam Gontor<br />Ponorogo, Jawa Timur 63472<br />www.gontor.ac.id</p>
                </div>
                <div>
                  <div className="font-bold mb-3 uppercase tracking-wider text-[11px] text-[#D69103]">Narahubung</div>
                  <p>Ahmad Nur Fajar D. P.<br />0813-9850-7876</p>
                  <p className="mt-2 font-bold text-[#D69103]">BRI: 0070-01-000315-56-7</p>
                </div>
              </div>

              <div className="max-w-6xl mx-auto text-center text-xs text-gray-400 pt-8 mt-12 border-t border-white/10">
                © 2026 Pagelaran Seni Drama Arena 5102 · Pondok Modern Darussalam Gontor
              </div>
            </footer>

            {/* SPONSORSHIP MODAL */}
            {isModalOpen && (
              <div className="fixed inset-0 z-50 flex items-center justify-center p-4 overflow-y-auto">
                <div className="fixed inset-0 bg-[#062B4A]/80 backdrop-blur-sm" onClick={() => setIsModalOpen(false)} />
                <div className="relative w-full max-w-2xl rounded-3xl p-6 sm:p-8 z-10 my-auto bg-[#F4F1EB] border-2 border-[#D69103] text-[#062B4A] shadow-2xl">
                  <button onClick={() => setIsModalOpen(false)} className="absolute top-5 right-5 p-2 text-[#062B4A] hover:opacity-70 cursor-pointer">
                    <IconClose />
                  </button>
                  <div className="mb-6">
                    <div className="text-xs text-[#D69103] font-bold uppercase tracking-wider">KEMITRAAN RESMI</div>
                    <h3 className="text-2xl font-bold text-[#062B4A] mt-1 font-mileast italic">Paket Sponsorship</h3>
                    <p className="text-xs text-gray-700 mt-1">Total Anggaran: <strong className="gold-text">Rp 500.107.000</strong></p>
                  </div>

                  <div className="grid grid-cols-1 sm:grid-cols-3 gap-4 mb-6">
                    {[
                      { tier: 'BRONZE', pct: '10%', amount: 'Rp 50.010.700' },
                      { tier: 'SILVER', pct: '30%', amount: 'Rp 150.032.100' },
                      { tier: 'GOLD', pct: '50%', amount: 'Rp 250.053.500' }
                    ].map(({ tier, pct, amount }) => (
                      <div key={tier} className="p-5 rounded-2xl bg-[#062B4A] text-[#F4F1EB] text-center border border-[#D69103]">
                        <div className="text-base font-bold gold-text">{tier}</div>
                        <div className="text-xs opacity-70 my-1">{pct} dari total</div>
                        <div className="text-sm font-bold">{amount}</div>
                      </div>
                    ))}
                  </div>

                  <div className="p-4 rounded-2xl bg-[#062B4A]/5 border border-[#D69103] text-xs">
                    <div className="font-bold text-[#D69103] mb-1">Rekening Resmi Sponsorship</div>
                    <div className="text-[#062B4A] font-bold text-sm">Bank BRI: 0070-01-000315-56-7</div>
                    <div className="text-gray-700 mt-0.5">a.n. Panitia Drama Arena Siswa Kelas 5 KMI PMDG</div>
                  </div>

                  <div className="flex justify-end mt-6">
                    <button onClick={() => { alert('Terima kasih! Tim kami akan menghubungi Anda.'); setIsModalOpen(false); }} className="bg-[#D69103] hover:bg-[#E8A820] text-[#062B4A] font-bold px-6 py-2.5 rounded-full text-sm flex items-center gap-2 cursor-pointer shadow-lg">
                      <span>Ajukan Sponsorship</span>
                      <ArrowRight className="w-4 h-4" />
                    </button>
                  </div>
                </div>
              </div>
            )}

            {/* SHOW MODAL */}
            {activeShow && (
              <div className="fixed inset-0 z-50 flex items-center justify-center p-4">
                <div className="fixed inset-0 bg-[#062B4A]/80 backdrop-blur-sm" onClick={() => setActiveShow(null)} />
                <div className="relative w-full max-w-lg rounded-3xl overflow-hidden z-10 bg-[#F4F1EB] border-2 border-[#D69103]">
                  <div className="relative h-48">
                    <img src={activeShow.img} alt={activeShow.title} className="w-full h-full object-cover" />
                    <div className="absolute inset-0 bg-gradient-to-t from-[#062B4A] to-transparent" />
                    <button onClick={() => setActiveShow(null)} className="absolute top-4 right-4 p-2 rounded-full bg-[#F4F1EB] text-[#062B4A] cursor-pointer">
                      <IconClose />
                    </button>
                    <div className="absolute bottom-4 left-4">
                      <div className="text-xs text-[#F5D98A] font-bold">{activeShow.category}</div>
                      <h3 className="text-xl font-bold text-white">{activeShow.title}</h3>
                    </div>
                  </div>
                  <div className="p-6">
                    <div className="text-xs text-[#D69103] uppercase font-bold tracking-wider mb-3">Daftar Penampilan</div>
                    <div className="flex flex-wrap gap-2">
                      {activeShow.items.map(item => (
                        <span key={item} className="px-3 py-1.5 rounded-full bg-[#062B4A] text-xs text-[#F5D98A] font-medium">
                          {item}
                        </span>
                      ))}
                    </div>
                  </div>
                </div>
              </div>
            )}

          </div>
        );
      }

      ReactDOM.createRoot(document.getElementById('root')).render(<App />);
    </script>
  </body>
</html>
