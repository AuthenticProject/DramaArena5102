<!DOCTYPE html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Pagelaran Seni Drama Arena 5102 — Pondok Modern Darussalam Gontor</title>
    <meta name="description" content="Pagelaran Seni Drama Arena 5102 Siswa Kelas 5 KMI Pondok Modern Darussalam Gontor. Moto: Sadar akan nilai perjuangan, tumbuhkan semangat kebersamaan. Tagline: Naluri dan Nurani." />
    
    <!-- Google Fonts: Kanit -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Kanit:ital,wght@0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap" rel="stylesheet">

    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            colors: {
              cyber: {
                bg: '#08090C',
                text: '#D7E2EA',
                darkText: '#0C0C0C',
                lightBg: '#FFFFFF',
                accent: '#0077B6',
                purple: '#7209B7',
                pink: '#F72585'
              }
            },
            fontFamily: {
              kanit: ['Kanit', 'sans-serif'],
            }
          }
        }
      }
    </script>

    <!-- React 18 & Babel CDN for direct browser preview -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/framer-motion@10.16.4/dist/framer-motion.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <style>
      *, *::before, *::after {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      html, body, #root, .main-wrapper {
        background-color: #08090C;
        color: #D7E2EA;
        font-family: 'Kanit', sans-serif;
        min-height: 100vh;
      }

      .main-wrapper {
        overflow-x: clip;
      }

      .hero-heading {
        background: linear-gradient(180deg, #53627A 0%, #A3C7E6 100%);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
      }

      /* Custom scrollbar */
      ::-webkit-scrollbar {
        width: 8px;
      }
      ::-webkit-scrollbar-track {
        background: #08090C;
      }
      ::-webkit-scrollbar-thumb {
        background: #53627A;
        border-radius: 4px;
      }
      ::-webkit-scrollbar-thumb:hover {
        background: #A3C7E6;
      }
    </style>
  </head>
  <body class="bg-[#08090C] text-[#D7E2EA]">
    <div id="root"></div>

    <!-- Application Script mounted via React -->
    <script type="text/babel">
      const { useState, useEffect, useRef } = React;
      const { motion, AnimatePresence, useScroll, useTransform } = window.Motion;

      // 1. TicketButton Component
      const TicketButton = ({ onClick, className = '', label = "Proposal Sponsorship" }) => (
        <button
          onClick={onClick}
          style={{
            background: 'linear-gradient(123deg, #091E3A 7%, #0077B6 37%, #7209B7 72%, #F72585 100%)',
            boxShadow: '0px 4px 4px rgba(247, 37, 133, 0.25), inset 4px 4px 12px #7209B7',
            outline: '2px solid #FFFFFF',
            outlineOffset: '-3px'
          }}
          className={`group relative rounded-full px-8 py-3 sm:px-10 sm:py-3.5 md:px-12 md:py-4 text-xs sm:text-sm md:text-base font-medium uppercase tracking-widest text-white transition-all duration-300 hover:scale-105 hover:brightness-110 active:scale-95 flex items-center justify-center gap-2 cursor-pointer ${className}`}
        >
          <span className="relative z-10">{label}</span>
          <span className="inline-block transition-transform duration-300 group-hover:translate-x-1">→</span>
        </button>
      );

      // 2. WatchTrailerButton Component
      const WatchTrailerButton = ({ onClick, className = '', label = "Prinjau Tampilan" }) => (
        <button
          onClick={onClick}
          className={`group rounded-full border-2 border-[#D7E2EA] px-8 py-3 sm:px-10 sm:py-3.5 text-sm sm:text-base font-medium uppercase tracking-widest text-[#D7E2EA] transition-all duration-300 hover:bg-[#D7E2EA]/10 hover:border-white hover:scale-105 active:scale-95 flex items-center justify-center gap-2 cursor-pointer ${className}`}
        >
          <span>{label}</span>
          <span className="inline-block transition-transform duration-300 group-hover:scale-125">▶</span>
        </button>
      );

      // 3. FadeIn Component
      const FadeIn = ({ children, delay = 0, duration = 0.7, x = 0, y = 30, className = '' }) => (
        <motion.div
          initial={{ opacity: 0, x, y }}
          whileInView={{ opacity: 1, x: 0, y: 0 }}
          viewport={{ once: true, margin: "50px", amount: 0 }}
          transition={{ duration, delay, ease: [0.25, 0.1, 0.25, 1] }}
          className={className}
        >
          {children}
        </motion.div>
      );

      // Main App mount in Vite
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
