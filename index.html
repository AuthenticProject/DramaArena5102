    <script>
      // Interactive Cyber Particle Mesh Canvas Engine
      (function initCyberParticles() {
        const canvas = document.getElementById('cyber-particle-canvas');
        if (!canvas) return;
        const ctx = canvas.getContext('2d');
        let width = canvas.width = window.innerWidth;
        let height = canvas.height = window.innerHeight;

        const particles = [];
        const particleCount = Math.min(Math.floor(window.innerWidth / 20), 65);
        const mouse = { x: -1000, y: -1000 };

        for (let i = 0; i < particleCount; i++) {
          particles.push({
            x: Math.random() * width,
            y: Math.random() * height,
            vx: (Math.random() - 0.5) * 0.5,
            vy: (Math.random() - 0.5) * 0.5,
            radius: Math.random() * 1.8 + 0.8,
            baseAlpha: Math.random() * 0.45 + 0.25
          });
        }

        window.addEventListener('resize', () => {
          width = canvas.width = window.innerWidth;
          height = canvas.height = window.innerHeight;
        });

        window.addEventListener('mousemove', (e) => {
          mouse.x = e.clientX;
          mouse.y = e.clientY;
        });

        window.addEventListener('mouseleave', () => {
          mouse.x = -1000;
          mouse.y = -1000;
        });

        function render() {
          ctx.clearRect(0, 0, width, height);

          for (let i = 0; i < particles.length; i++) {
            const p = particles[i];
            p.x += p.vx;
            p.y += p.vy;

            if (p.x < 0) p.x = width;
            if (p.x > width) p.x = 0;
            if (p.y < 0) p.y = height;
            if (p.y > height) p.y = 0;

            // Draw Node
            ctx.beginPath();
            ctx.arc(p.x, p.y, p.radius, 0, Math.PI * 2);
            ctx.fillStyle = 'rgba(56, 189, 248, ' + p.baseAlpha + ')';
            ctx.shadowColor = 'rgba(0, 240, 255, 0.9)';
            ctx.shadowBlur = 8;
            ctx.fill();
            ctx.shadowBlur = 0;

            // Connecting lines to neighboring particles
            for (let j = i + 1; j < particles.length; j++) {
              const p2 = particles[j];
              const dx = p.x - p2.x;
              const dy = p.y - p2.y;
              const dist = Math.sqrt(dx * dx + dy * dy);

              if (dist < 110) {
                const alpha = (1 - dist / 110) * 0.22;
                ctx.beginPath();
                ctx.moveTo(p.x, p.y);
                ctx.lineTo(p2.x, p2.y);
                ctx.strokeStyle = 'rgba(56, 189, 248, ' + alpha + ')';
                ctx.lineWidth = 0.8;
                ctx.stroke();
              }
            }

            // Connection to mouse
            const mdx = p.x - mouse.x;
            const mdy = p.y - mouse.y;
            const mdist = Math.sqrt(mdx * mdx + mdy * mdy);
            if (mdist < 140) {
              const mAlpha = (1 - mdist / 140) * 0.45;
              ctx.beginPath();
              ctx.moveTo(p.x, p.y);
              ctx.lineTo(mouse.x, mouse.y);
              ctx.strokeStyle = 'rgba(0, 240, 255, ' + mAlpha + ')';
              ctx.lineWidth = 1.2;
              ctx.stroke();
            }
          }

          requestAnimationFrame(render);
        }
        render();
      })();
    </script>

    <script type="text/babel">

      // ==========================================
      // WEB AUDIO API FUTURISTIC SOUND EFFECTS SYNTH
      // ==========================================
      const SoundFX = {
        ctx: null,
        enabled: true,
        init() {
          if (!this.ctx && (window.AudioContext || window.webkitAudioContext)) {
            this.ctx = new (window.AudioContext || window.webkitAudioContext)();
          }
        },
        play(type) {
          if (!this.enabled) return;
          this.init();
          if (!this.ctx) return;
          if (this.ctx.state === 'suspended') this.ctx.resume();
          const now = this.ctx.currentTime;
          const osc = this.ctx.createOscillator();
          const gain = this.ctx.createGain();
          osc.connect(gain);
          gain.connect(this.ctx.destination);

          if (type === 'click') {
            osc.type = 'sine';
            osc.frequency.setValueAtTime(800, now);
            osc.frequency.exponentialRampToValueAtTime(350, now + 0.05);
            gain.gain.setValueAtTime(0.08, now);
            gain.gain.linearRampToValueAtTime(0.001, now + 0.05);
            osc.start(now);
            osc.stop(now + 0.05);
          } else if (type === 'chime') {
            osc.type = 'triangle';
            osc.frequency.setValueAtTime(587.33, now);
            osc.frequency.exponentialRampToValueAtTime(880, now + 0.18);
            gain.gain.setValueAtTime(0.12, now);
            gain.gain.exponentialRampToValueAtTime(0.001, now + 0.4);
            osc.start(now);
            osc.stop(now + 0.4);
          } else if (type === 'laser') {
            osc.type = 'sawtooth';
            osc.frequency.setValueAtTime(1400, now);
            osc.frequency.exponentialRampToValueAtTime(160, now + 0.18);
            gain.gain.setValueAtTime(0.09, now);
            gain.gain.linearRampToValueAtTime(0.001, now + 0.18);
            osc.start(now);
            osc.stop(now + 0.18);
          } else if (type === 'swoosh') {
            osc.type = 'sine';
            osc.frequency.setValueAtTime(180, now);
            osc.frequency.exponentialRampToValueAtTime(650, now + 0.08);
            osc.frequency.exponentialRampToValueAtTime(120, now + 0.22);
            gain.gain.setValueAtTime(0.07, now);
            gain.gain.linearRampToValueAtTime(0.001, now + 0.22);
            osc.start(now);
            osc.stop(now + 0.22);
          } else if (type === 'cheer') {
            [523.25, 659.25, 783.99, 1046.50].forEach((freq, i) => {
              const o = this.ctx.createOscillator();
              const g = this.ctx.createGain();
              o.type = 'triangle';
              o.frequency.value = freq;
              g.gain.setValueAtTime(0.06, now + i * 0.05);
              g.gain.exponentialRampToValueAtTime(0.001, now + 0.6 + i * 0.05);
              o.connect(g);
              g.connect(this.ctx.destination);
              o.start(now + i * 0.05);
              o.stop(now + 0.7 + i * 0.05);
            });
          }
        }
      };

        { id: 3, title: "Bab III: Profil & Sebaran 20 Kampus", excerpt: "Meliputi 9 Kampus di Jawa (Pusat Ponorogo, Kediri, Banyuwangi, Magelang, Mantingan, Ngawi), 7 Kampus di Sumatera (Aceh, Riau, Solok, Jambi, Lampung), dan 4 Kampus di Sulawesi (Poso dan Konawe Selatan)." },
        { id: 4, title: "Bab IV: Konsep Panggung & Konser", excerpt: "Dimensi backdrop lebar 26,84 meter & tinggi 12 meter, panggung 24,4 x 7,32 meter, 48 unit lampu Beam, 37 Par LED, 3 Set LED Videotron 3x6m, serta SFX Pyrotechnics, Dry Ice, dan Confetti Gun." },
        { id: 5, title: "Bab V: Rencana Anggaran Rp 500 Juta", excerpt: "Total anggaran Rp 500.107.000 terbagi pada 13 divisi teknis: Humas (Rp 185,4 Jt), Kostum (Rp 101,9 Jt), Konsumsi (Rp 86,4 Jt), Dekorasi (Rp 67,3 Jt), Sekretaris (Rp 64,1 Jt), Properti (Rp 57,3 Jt), Pertamanan (Rp 50,5 Jt)." },
        { id: 6, title: "Bab VI: Ketentuan Kemitraan Sponsorship", excerpt: "Penawaran paket kemitraan Bronze (10%), Silver (30%), Gold (50%) dengan hak kontraprestasi media cetak, videotron, event gate, merchandise, dan stand promosi." }
      ];

      // Arena Masterplan Seating Zones Data
      const arenaZones = [
        { id: 'vvip', name: 'Zona VVIP & VIP Kehormatan', capacity: '120 Kursi', view: '100% Optimal (Front Center)', desc: 'Area sofa berlapis karpet merah khusus Pimpinan Pondok Modern Darussalam Gontor, Tamu VIP Negara, dan Dewan Asatidz Senior.', icon: '👑', color: 'from-amber-500 to-yellow-400' },
        { id: 'zone-a', name: 'Zona A · Penggerak Santri 5102', capacity: '441 Santri', view: 'Akses Panggung & Backstage', desc: 'Area sayap kiri dan kanan panggung untuk seluruh siswa Kelas 5 KMI pelaksana acara, kru teknis panggung, dan penampil seni.', icon: '🎭', color: 'from-sky-500 to-cyan-400' },
        { id: 'zone-b', name: 'Zona B · Santri Kampus Pusat', capacity: '3.500+ Santri', view: 'Area Utama Lapangan Terbuka', desc: 'Kawasan tribun datar tengah lapangan utama berundak tertata rapi bagi seluruh santri Kelas 1 sampai 6 KMI PMDG Kampus Pusat.', icon: '👥', color: 'from-blue-600 to-sky-500' },
        { id: 'zone-c', name: 'Zona C · Tamu Undangan & Wali Santri', capacity: '1.200 Kursi', view: 'Sayap Selatan & Tribun Belakang', desc: 'Area kehormatan tertutup kanopi bagi para wali santri, alumni Gontor, dan para simpatisan dermawan dari berbagai kota.', icon: '✨', color: 'from-indigo-600 to-purple-500' },
        { id: 'foh', name: 'Zona FOH Rig (Sound & Lighting)', capacity: '20 Operator Teknis', view: 'Pusat Kontrol Audio & Beam', desc: 'Menara pusat kendali pencahayaan 48 unit Beam, visual videotron 3 layar, dan sistem tata suara berdaya 30.000 Watt.', icon: '🎛️', color: 'from-emerald-500 to-teal-400' }
      ];

      // Interactive 3D Nusantara Map Component
      const IndonesiaMap3D = () => {
        const mountRef = useRef(null);
        const [loading, setLoading] = useState(true);
        const [loadingProgress, setLoadingProgress] = useState(0);
        const [autoRotate, setAutoRotate] = useState(true);
        const [activeCampus, setActiveCampus] = useState(gontorCampuses[0]);
        const [regionFilter, setRegionFilter] = useState('Semua');
        const [searchQuery, setSearchQuery] = useState('');
        const controlsRef = useRef(null);
        const cameraRef = useRef(null);
        const pinMeshesRef = useRef([]);

        const filteredCampuses = gontorCampuses.filter((c) => {
          const matchRegion = regionFilter === 'Semua' || c.region === regionFilter;
          const matchSearch = c.name.toLowerCase().includes(searchQuery.toLowerCase()) ||
                              c.code.toLowerCase().includes(searchQuery.toLowerCase()) ||
                              c.location.toLowerCase().includes(searchQuery.toLowerCase());
          return matchRegion && matchSearch;
        });

        const focusOnCampus = (campus) => {
          SoundFX.play('click');
          setActiveCampus(campus);
          if (controlsRef.current && cameraRef.current) {
            const controls = controlsRef.current;
            controls.target.set(campus.x, 0, campus.z);
            cameraRef.current.position.set(campus.x, 18, campus.z + 24);
            controls.update();
          }
        };

        useEffect(() => {
          let animationFrameId;
          let renderer, scene, camera, controls, raycaster, mouse;

          const loadThreeScript = async () => {
            if (!window.THREE) {
              await new Promise((resolve) => {
                const script = document.createElement('script');
                script.src = 'https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js';
                script.onload = resolve;
                document.head.appendChild(script);
              });
            }
            if (!window.THREE?.GLTFLoader) {
              await new Promise((resolve) => {
                const script = document.createElement('script');
                script.src = 'https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js';
                script.onload = resolve;
                document.head.appendChild(script);
              });
            }
            if (!window.THREE?.OrbitControls) {
              await new Promise((resolve) => {
                const script = document.createElement('script');
                script.src = 'https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js';
                script.onload = resolve;
                document.head.appendChild(script);
              });
            }

            initThree();
          };

          const createBadgeTexture = (THREE, text, isPusat = false) => {
            const canvas = document.createElement('canvas');
            canvas.width = 256;
            canvas.height = 256;
            const ctx = canvas.getContext('2d');

            ctx.shadowColor = 'rgba(0, 240, 255, 0.8)';
            ctx.shadowBlur = 20;

            ctx.beginPath();
            ctx.arc(128, 128, 106, 0, Math.PI * 2);
            ctx.fillStyle = isPusat ? '#082142' : '#0B2D58';
            ctx.fill();

            ctx.lineWidth = 10;
            ctx.strokeStyle = isPusat ? '#00F0FF' : '#38BDF8';
            ctx.stroke();

            ctx.beginPath();
            ctx.arc(128, 128, 92, 0, Math.PI * 2);
            ctx.lineWidth = 3;
            ctx.setLineDash([8, 6]);
            ctx.strokeStyle = '#BAE6FD';
            ctx.stroke();
            ctx.setLineDash([]);

            ctx.shadowBlur = 0;

            if (isPusat) {
              ctx.font = 'bold 36px "Space Grotesk", sans-serif';
              ctx.fillStyle = '#00F0FF';
              ctx.textAlign = 'center';
              ctx.fillText('👑 PUSAT', 128, 98);

              ctx.font = 'bold 38px "Space Grotesk", sans-serif';
              ctx.fillStyle = '#FFFFFF';
              ctx.fillText('PMDG', 128, 152);
            } else {
              ctx.font = 'bold 44px "Space Grotesk", sans-serif';
              ctx.fillStyle = '#BAE6FD';
              ctx.textAlign = 'center';
              ctx.textBaseline = 'middle';
              ctx.fillText(text, 128, 128);
            }

            const texture = new THREE.CanvasTexture(canvas);
            texture.needsUpdate = true;
            return texture;
          };

          const initThree = () => {
            if (!mountRef.current) return;
            const THREE = window.THREE;
            const container = mountRef.current;
            const width = container.clientWidth;
            const height = container.clientHeight;

            scene = new THREE.Scene();
            raycaster = new THREE.Raycaster();
            mouse = new THREE.Vector2();

            camera = new THREE.PerspectiveCamera(45, width / height, 0.1, 1000);
            camera.position.set(0, 36, 62);
            cameraRef.current = camera;

            renderer = new THREE.WebGLRenderer({ alpha: true, antialias: true });
            renderer.setSize(width, height);
            renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
            renderer.shadowMap.enabled = true;
            renderer.shadowMap.type = THREE.PCFSoftShadowMap;

            while (container.firstChild) {
              container.removeChild(container.firstChild);
            }
            container.appendChild(renderer.domElement);

            controls = new THREE.OrbitControls(camera, renderer.domElement);
            controls.enableDamping = true;
            controls.dampingFactor = 0.05;
            controls.maxPolarAngle = Math.PI / 2.15;
            controls.minDistance = 12;
            controls.maxDistance = 140;
            controls.autoRotate = autoRotate;
            controls.autoRotateSpeed = 0.35;
            controlsRef.current = controls;

            const ambientLight = new THREE.AmbientLight(0xE0F2FE, 1.4);
            scene.add(ambientLight);

            const mainLight = new THREE.DirectionalLight(0x00F0FF, 3.2);
            mainLight.position.set(30, 50, 40);
            mainLight.castShadow = true;
            scene.add(mainLight);

            const fillLight = new THREE.DirectionalLight(0x0284C7, 1.8);
            fillLight.position.set(-30, 20, -30);
            scene.add(fillLight);

            const pointLight = new THREE.PointLight(0x7DD3FC, 2.5, 100);
            pointLight.position.set(0, 25, 10);
            scene.add(pointLight);

            const iceMetallicColors = [0x0284C7, 0x0EA5E9, 0x38BDF8, 0x7DD3FC, 0x00F0FF];

            const renderPinsAndConnections = (modelWrapper) => {
              const findLandSurfaceY = (targetX, targetZ) => {
                if (!modelWrapper) return { y: 0, posX: targetX, posZ: targetZ };

                const downRay = new THREE.Raycaster();
                const rayDir = new THREE.Vector3(0, -1, 0);

                downRay.set(new THREE.Vector3(targetX, 100, targetZ), rayDir);
                let hits = downRay.intersectObject(modelWrapper, true);
                if (hits.length > 0) {
                  return { y: hits[0].point.y, posX: targetX, posZ: targetZ };
                }

                const radii = [0.2, 0.5, 0.8, 1.2, 1.8, 2.5];
                const angles = [0, Math.PI / 4, Math.PI / 2, 3 * Math.PI / 4, Math.PI, 5 * Math.PI / 4, 3 * Math.PI / 2, 7 * Math.PI / 4];
                for (const r of radii) {
                  for (const a of angles) {
                    const testX = targetX + r * Math.cos(a);
                    const testZ = targetZ + r * Math.sin(a);
                    downRay.set(new THREE.Vector3(testX, 100, testZ), rayDir);
                    hits = downRay.intersectObject(modelWrapper, true);
                    if (hits.length > 0) {
                      return { y: hits[0].point.y, posX: testX, posZ: testZ };
                    }
                  }
                }

                const mapBox = new THREE.Box3().setFromObject(modelWrapper);
                return { y: mapBox.max.y, posX: targetX, posZ: targetZ };
              };

              const pusatCampus = gontorCampuses[0];
              const pusatLand = findLandSurfaceY(pusatCampus.x, pusatCampus.z);
              const pusatPos = new THREE.Vector3(pusatLand.posX, pusatLand.y + 0.3, pusatLand.posZ);

              const createdPinMeshes = [];

              gontorCampuses.forEach((campus) => {
                const land = findLandSurfaceY(campus.x, campus.z);
                const branchPos = new THREE.Vector3(land.posX, land.y + 0.3, land.posZ);

                if (!campus.isPusat) {
                  const midX = (pusatPos.x + branchPos.x) / 2;
                  const midZ = (pusatPos.z + branchPos.z) / 2;
                  const dist = pusatPos.distanceTo(branchPos);
                  const midY = Math.max(pusatPos.y, branchPos.y) + Math.min(dist * 0.3, 10);

                  const curve = new THREE.QuadraticBezierCurve3(
                    pusatPos,
                    new THREE.Vector3(midX, midY, midZ),
                    branchPos
                  );

                  const points = curve.getPoints(40);
                  const curveGeo = new THREE.BufferGeometry().setFromPoints(points);
                  const curveMat = new THREE.LineBasicMaterial({
                    color: 0x00F0FF,
                    transparent: true,
                    opacity: 0.85,
                    linewidth: 2
                  });
                  const curveLine = new THREE.Line(curveGeo, curveMat);
                  scene.add(curveLine);
                }

                const pinGroup = new THREE.Group();
                pinGroup.position.set(land.posX, land.y, land.posZ);

                const ringGeo = new THREE.RingGeometry(0.3, 0.7, 32);
                const ringMat = new THREE.MeshBasicMaterial({
                  color: campus.isPusat ? 0x00F0FF : 0x38BDF8,
                  side: THREE.DoubleSide,
                  transparent: true,
                  opacity: 0.95
                });
                const ringMesh = new THREE.Mesh(ringGeo, ringMat);
                ringMesh.rotation.x = Math.PI / 2;
                ringMesh.position.y = 0.05;
                pinGroup.add(ringMesh);

                const stemGeo = new THREE.CylinderGeometry(0.08, 0.08, 1.8, 8);
                const stemMat = new THREE.MeshBasicMaterial({ color: campus.isPusat ? 0x00F0FF : 0x0284C7 });
                const stemMesh = new THREE.Mesh(stemGeo, stemMat);
                stemMesh.position.y = 0.9;
                pinGroup.add(stemMesh);

                const badgeTexture = createBadgeTexture(THREE, campus.code, campus.isPusat);
                const spriteMat = new THREE.SpriteMaterial({ map: badgeTexture, transparent: true });
                const sprite = new THREE.Sprite(spriteMat);
                sprite.scale.set(campus.isPusat ? 3.4 : 2.6, campus.isPusat ? 3.4 : 2.6, 1);
                sprite.position.y = 2.4;
                sprite.userData = campus;
                pinGroup.add(sprite);
                createdPinMeshes.push(sprite);

                if (campus.isPusat) {
                  const bigRingGeo = new THREE.RingGeometry(0.8, 1.6, 32);
                  const bigRingMat = new THREE.MeshBasicMaterial({ color: 0x00F0FF, side: THREE.DoubleSide, transparent: true, opacity: 0.9 });
                  const bigRingMesh = new THREE.Mesh(bigRingGeo, bigRingMat);
                  bigRingMesh.rotation.x = Math.PI / 2;
                  bigRingMesh.position.y = 0.06;
                  pinGroup.add(bigRingMesh);

                  const glowLight = new THREE.PointLight(0x00F0FF, 3.5, 18);
                  glowLight.position.y = 2.4;
                  pinGroup.add(glowLight);
                }

                scene.add(pinGroup);
              });
              pinMeshesRef.current = createdPinMeshes;
            };

            const createFallbackGround = () => {
              const gridHelper = new THREE.GridHelper(60, 30, 0x00F0FF, 0x0369A1);
              gridHelper.position.y = -0.1;
              scene.add(gridHelper);

              const groundGeo = new THREE.CylinderGeometry(32, 35, 1, 64);
              const groundMat = new THREE.MeshStandardMaterial({
                color: 0x061833,
                metalness: 0.85,
                roughness: 0.2,
                emissive: 0x021024
              });
              const groundMesh = new THREE.Mesh(groundGeo, groundMat);
              groundMesh.position.y = -0.6;
              groundMesh.receiveShadow = true;
              scene.add(groundMesh);
            };

            if (THREE.GLTFLoader) {
              const glbPath = './peta_provinsi_indonesia.glb';
              const loader = new THREE.GLTFLoader();
              loader.load(
                glbPath,
                (gltf) => {
                  const model = gltf.scene;
                  const initialBox = new THREE.Box3().setFromObject(model);
                  const initialSize = initialBox.getSize(new THREE.Vector3());

                  if (initialSize.y > initialSize.z * 1.5) {
                    model.rotation.x = -Math.PI / 2;
                  }

                  const modelWrapper = new THREE.Group();
                  const box = new THREE.Box3().setFromObject(model);
                  const center = box.getCenter(new THREE.Vector3());
                  const size = box.getSize(new THREE.Vector3());

                  model.position.set(-center.x, -center.y, -center.z);
                  modelWrapper.add(model);

                  const maxDim = Math.max(size.x, size.y, size.z);
                  const scale = 50 / maxDim;
                  modelWrapper.scale.set(scale, scale, scale);

                  let meshIdx = 0;
                  model.traverse((child) => {
                    if (child.isMesh) {
                      child.castShadow = true;
                      child.receiveShadow = true;
                      const colorHex = iceMetallicColors[meshIdx % iceMetallicColors.length];
                      meshIdx++;

                      child.material = new THREE.MeshStandardMaterial({
                        color: colorHex,
                        metalness: 0.75,
                        roughness: 0.2,
                        emissive: 0x031B38,
                        shadowSide: THREE.DoubleSide
                      });
                    }
                  });

                  scene.add(modelWrapper);
                  modelWrapper.updateMatrixWorld(true);

                  renderPinsAndConnections(modelWrapper);
                  setLoading(false);
                },
                (xhr) => {
                  if (xhr.lengthComputable) {
                    const percent = Math.round((xhr.loaded / xhr.total) * 100);
                    setLoadingProgress(percent);
                  }
                },
                (err) => {
                  console.warn('GLB load fallback triggered', err);
                  createFallbackGround();
                  renderPinsAndConnections();
                  setLoading(false);
                }
              );
            } else {
              createFallbackGround();
              renderPinsAndConnections();
              setLoading(false);
            }

            const handlePointerMove = (event) => {
              const rect = renderer.domElement.getBoundingClientRect();
              mouse.x = ((event.clientX - rect.left) / rect.width) * 2 - 1;
              mouse.y = -((event.clientY - rect.top) / rect.height) * 2 + 1;

              raycaster.setFromCamera(mouse, camera);
              const intersects = raycaster.intersectObjects(pinMeshesRef.current);
              if (intersects.length > 0) {
                const campusData = intersects[0].object.userData;
                if (campusData) {
                  setActiveCampus(campusData);
                }
              }
            };
            renderer.domElement.addEventListener('mousemove', handlePointerMove);

            const animate = () => {
              animationFrameId = requestAnimationFrame(animate);
              if (controls) controls.update();
              if (renderer && scene && camera) renderer.render(scene, camera);
            };
            animate();

            const handleResize = () => {
              if (!container || !renderer || !camera) return;
              const w = container.clientWidth;
              const h = container.clientHeight;
              camera.aspect = w / h;
              camera.updateProjectionMatrix();
              renderer.setSize(w, h);
            };
            window.addEventListener('resize', handleResize);

            return () => {
              window.addEventListener('resize', handleResize);
              if (renderer?.domElement) {
                renderer.domElement.removeEventListener('mousemove', handlePointerMove);
                renderer.domElement.remove();
              }
              cancelAnimationFrame(animationFrameId);
            };
          };

          loadThreeScript();
        }, []);

        const toggleAutoRotate = () => {
          SoundFX.play('click');
          const nextState = !autoRotate;
          setAutoRotate(nextState);
          if (controlsRef.current) controlsRef.current.autoRotate = nextState;
        };

        const resetCameraView = () => {
          SoundFX.play('swoosh');
          if (controlsRef.current && cameraRef.current) {
            controlsRef.current.target.set(0, 0, 0);
            cameraRef.current.position.set(0, 36, 62);
            controlsRef.current.reset();
          }
        };

        return (
          <section id="map" className="relative py-24 px-6 scroll-reveal">
            <div className="max-w-6xl mx-auto">
              <div className="text-center mb-10">
                <div className="inline-flex items-center gap-2 px-4 py-1.5 rounded-full border border-cyan-400/40 bg-cyan-500/10 text-cyan-300 text-xs md:text-sm font-semibold mb-3">
                  <Globe className="w-4 h-4 text-cyan-400 animate-pulse" />
                  JARINGAN PMDG · 20 KAMPUS SE-INDONESIA
                </div>
                <h2 className="text-3xl md:text-5xl font-extrabold tracking-tight text-white font-sans">
                  Peta 3D <span className="gradient-shimmer">Nusantara PMDG</span>
                </h2>
                <p className="text-sky-200/80 text-sm mt-3 max-w-2xl mx-auto leading-relaxed">
                  Visualisasi 3D topografi kepulauan Indonesia yang memetakan persebaran 20 kampus cabang putra dan putri dari pusat peradaban Gontor di Ponorogo.
                </p>

                {/* Region Filter & Search */}
                <div className="mt-8 flex flex-col sm:flex-row items-center justify-center gap-3 max-w-2xl mx-auto">
                  <div className="flex items-center gap-1.5 p-1 rounded-full glass-capsule">
                    {['Semua', 'Jawa', 'Sumatera', 'Sulawesi'].map((r) => (
                      <button
                        key={r}
                        onClick={() => { SoundFX.play('click'); setRegionFilter(r); }}
                        className={`px-4 py-1.5 rounded-full text-xs font-bold transition-all cursor-pointer ${
                          regionFilter === r
                            ? 'bg-gradient-to-r from-sky-500 to-cyan-400 text-slate-950 font-extrabold shadow-[0_0_15px_rgba(0,240,255,0.4)]'
                            : 'text-sky-200 hover:text-white'
                        }`}
                      >
                        {r}
                      </button>
                    ))}
                  </div>

                  <div className="relative w-full sm:w-72">
                    <Search className="w-4 h-4 absolute left-4 top-1/2 -translate-y-1/2 text-cyan-400" />
                    <input
                      type="text"
                      placeholder="Cari nama kampus atau kota..."
                      value={searchQuery}
                      onChange={(e) => setSearchQuery(e.target.value)}
                      className="w-full pl-10 pr-4 py-2 rounded-full glass-capsule text-xs text-white placeholder-sky-300/60 focus:outline-none focus:ring-2 focus:ring-cyan-400"
                    />
                  </div>
                </div>
              </div>

              {/* 3D Glass Frame */}
              <div className="p-4 sm:p-6 rounded-3xl glass-panel relative overflow-hidden border border-sky-400/30 shadow-[0_25px_60px_rgba(0,0,0,0.6)]">
                <div className="flex flex-wrap items-center justify-between px-3 py-2.5 mb-2 border-b border-sky-500/20">
                  <div className="flex items-center gap-2">
                    <div className="w-2.5 h-2.5 rounded-full bg-cyan-400 animate-ping" />
                    <span className="text-xs font-bold text-sky-200 font-display">Interactive 3D Engine · Orbit Controls Active</span>
                  </div>
                  <div className="flex items-center gap-2">
                    <button
                      onClick={toggleAutoRotate}
                      className="px-3.5 py-1.5 rounded-full text-xs font-semibold bg-sky-500/20 hover:bg-sky-500/30 text-cyan-300 border border-cyan-400/40 transition-all cursor-pointer"
                    >
                      {autoRotate ? '⏸ Jeda Rotasi' : '▶ Putar Otomatis'}
                    </button>
                    <button
                      onClick={resetCameraView}
                      className="px-3.5 py-1.5 rounded-full text-xs font-semibold glass-capsule text-sky-200 hover:text-white border border-sky-400/30 transition-all cursor-pointer"
                    >
                      ↺ Reset Kamera
                    </button>
                  </div>
                </div>

                <div className="relative w-full h-[460px] sm:h-[530px] rounded-2xl overflow-hidden bg-gradient-to-b from-sky-950/70 via-slate-950/80 to-sky-950/90 cursor-grab active:cursor-grabbing border border-sky-500/20 shadow-inner">
                  {loading && (
                    <div className="absolute inset-0 z-20 flex flex-col items-center justify-center bg-sky-950/85 backdrop-blur-md text-white">
                      <div className="w-10 h-10 rounded-full border-3 border-cyan-400 border-t-transparent animate-spin mb-3" />
                      <div className="font-bold text-sm tracking-wide text-cyan-200 font-display">Memuat Model 3D Nusantara...</div>
                      <div className="text-xs text-sky-300 mt-1">{loadingProgress}% terunduh</div>
                    </div>
                  )}

                  <div ref={mountRef} className="w-full h-full" />

                  {/* Active Campus Glass Card Popup */}
                  {activeCampus && (
                    <div className="absolute bottom-5 left-5 right-5 sm:right-auto sm:max-w-md p-5 rounded-2xl glass-deep border border-cyan-400/40 shadow-[0_15px_35px_rgba(0,0,0,0.7)] z-30">
                      <div className="flex items-center justify-between text-xs font-bold mb-1.5">
                        <span className="text-cyan-300 font-display tracking-wider">
                          {activeCampus.isPusat ? '👑 KAMPUS PUSAT PONOROGO' : `WILAYAH ${activeCampus.region.toUpperCase()}`}
                        </span>
                        <span className="px-2.5 py-0.5 rounded-full bg-gradient-to-r from-sky-500 to-cyan-400 text-slate-950 font-extrabold text-[10px]">
                          {activeCampus.code}
                        </span>
                      </div>

                    <img src={activeShow.img} alt={activeShow.title} className="w-full h-full object-cover" />
                    <div className="absolute inset-0 bg-gradient-to-t from-slate-950 via-sky-950/40 to-transparent" />
                    <button 
                      onClick={() => setActiveShow(null)} 
                      className="absolute top-4 right-4 p-2 rounded-full glass-panel text-white cursor-pointer"
                    >
                      ✕
                    </button>
                    <div className="absolute bottom-4 left-5 right-5">
                      <div className="text-xs text-cyan-300 font-bold uppercase tracking-wider font-display">{activeShow.category}</div>
                      <h3 className="text-xl font-extrabold text-white leading-tight mt-0.5 font-display">{activeShow.title}</h3>
                    </div>
                  </div>
                  <div className="p-6">
                    <p className="text-xs text-sky-200/90 mb-4 leading-relaxed">
                      {activeShow.desc}
                    </p>
                    <div className="text-xs text-cyan-300 uppercase font-bold tracking-wider mb-2.5 font-display">
                      Daftar Penampilan & Sub-Acara:
                    </div>
                    <div className="flex flex-wrap gap-2">
                      {activeShow.items.map(item => (
                        <span key={item} className="px-3 py-1.5 rounded-full glass-capsule text-xs font-semibold text-white border border-sky-400/30">
                          {item}
                        </span>
                      ))}
                    </div>
                  </div>
                </div>
              </div>
            )}

          </div>
        );
      }

      ReactDOM.createRoot(document.getElementById('root')).render(<App />);
    </script>
  </body>
</html>
